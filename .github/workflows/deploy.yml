name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build website
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
        run: |
          npm run build:web

      # GitHub Pages caches HTML after the deployment action removes its hashed assets.
      # Restore the prior release so a stale app shell can load and update itself.
      - name: Restore previous hashed assets
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages --depth=2
          git archive --format=tar origin/gh-pages~1 -- ':(glob)*-*.js' ':(glob)*-*.css' | tar -x -C dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: beta.sunce.app
          keep_files: true
